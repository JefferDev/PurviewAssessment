name: Release PurviewAssessment

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gate de SOLO LECTURA (bloqueante)
        shell: pwsh
        run: ./build/Invoke-ReadOnlyGate.ps1 -ModulePath .

      - name: Instalar Pester
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5 -Scope CurrentUser -Force

      - name: Pester
        shell: pwsh
        run: |
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = './Tests'
          $cfg.Run.PassThru = $true
          $cfg.Run.Exit = $false
          $cfg.Output.Verbosity = 'Detailed'
          # Pester emite sus propias anotaciones, que solo traen el nombre de la
          # prueba y agotan el cupo de 10 por paso. Se desactivan para dejar sitio
          # a las de abajo, que si llevan el mensaje del fallo.
          $cfg.Output.CIFormat = 'None'
          $r = Invoke-Pester -Configuration $cfg

          # Publica cada fallo como anotacion, con el mensaje completo. Sin esto
          # la anotacion solo trae el nombre de la prueba y el log del runner no
          # siempre es accesible.
          $fallidas = @($r.Tests | Where-Object Result -eq 'Failed')
          foreach ($t in $fallidas) {
              $msg = (@($t.ErrorRecord | ForEach-Object {
                  $_.DisplayErrorMessage, $_.DisplayStackTrace -join "`n"
              }) -join "`n") -replace "`r", ''
              $plano = $msg -replace "`n", '%0A' -replace ':', '%3A'
              Write-Host "::error title=$($t.ExpandedPath)::$plano"
          }

          '## Pruebas fallidas' | Out-File $env:GITHUB_STEP_SUMMARY -Append
          foreach ($t in $fallidas) {
              "### $($t.ExpandedPath)"            | Out-File $env:GITHUB_STEP_SUMMARY -Append
              '```'                               | Out-File $env:GITHUB_STEP_SUMMARY -Append
              ($t.ErrorRecord | Out-String)       | Out-File $env:GITHUB_STEP_SUMMARY -Append
              '```'                               | Out-File $env:GITHUB_STEP_SUMMARY -Append
          }

          Write-Host "Resultado: $($r.PassedCount) pasaron, $($r.FailedCount) fallaron, $($r.SkippedCount) omitidas."
          if ($r.FailedCount -gt 0) { exit 1 }

      - name: Verificar que la etiqueta coincide con ModuleVersion
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}' -replace '^v', ''
          $man = Import-PowerShellDataFile ./PurviewAssessment.psd1
          if ($tag -ne $man.ModuleVersion) {
              throw "La etiqueta ($tag) no coincide con ModuleVersion ($($man.ModuleVersion))."
          }
          Write-Host "Version validada: $tag"

      - name: Construir el paquete de distribucion
        shell: pwsh
        run: |
          $ver  = (Import-PowerShellDataFile ./PurviewAssessment.psd1).ModuleVersion
          $dest = Join-Path $env:RUNNER_TEMP "stage/PurviewAssessment/$ver"
          New-Item -ItemType Directory -Path $dest -Force | Out-Null

          # Solo lo que el modulo necesita en tiempo de ejecucion.
          $incluir = @(
              'PurviewAssessment.psd1', 'PurviewAssessment.psm1',
              'Public', 'Private', 'Controls', 'Assets', 'LICENSE'
          )
          foreach ($i in $incluir) {
              if (Test-Path $i) { Copy-Item $i -Destination $dest -Recurse -Force }
          }

          $zip = Join-Path $env:RUNNER_TEMP "PurviewAssessment-$ver.zip"
          Compress-Archive -Path (Join-Path $env:RUNNER_TEMP 'stage/PurviewAssessment') `
                           -DestinationPath $zip -Force

          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          Set-Content -Path "$zip.sha256" -Value "$hash  PurviewAssessment-$ver.zip" -Encoding ascii

          "ZIP=$zip"          | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "SHA=$hash"         | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "VER=$ver"          | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publicar la Release
        uses: softprops/action-gh-release@v2
        with:
          name: PurviewAssessment v${{ env.VER }}
          files: |
            ${{ env.ZIP }}
            ${{ env.ZIP }}.sha256
          body: |
            Modulo de evaluacion de solo lectura de Microsoft Purview, version ${{ env.VER }}.

            SHA256 del paquete: `${{ env.SHA }}`

            Instalacion en un equipo nuevo (PowerShell 7.2 o superior). El
            repositorio es privado, de modo que se requiere un token de lectura:

            ```powershell
            $env:GITHUB_TOKEN = 'github_pat_...'
            $u = 'https://raw.githubusercontent.com/${{ github.repository }}/main/Install-PurviewAssessment.ps1'
            $h = @{ Authorization = "Bearer $env:GITHUB_TOKEN" }
            & ([scriptblock]::Create((irm $u -Headers $h)))
            ```

            Instalacion de esta version concreta:

            ```powershell
            & ([scriptblock]::Create((irm $u -Headers $h))) -Version ${{ env.VER }}
            ```
