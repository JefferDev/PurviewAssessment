name: CI PurviewAssessment

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Gate de SOLO LECTURA (bloqueante)
        shell: pwsh
        run: ./build/Invoke-ReadOnlyGate.ps1 -ModulePath .

      - name: Instalar PSScriptAnalyzer y Pester
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -MinimumVersion 1.22 -Scope CurrentUser -Force
          Install-Module Pester -MinimumVersion 5.5 -Scope CurrentUser -Force

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          $r = Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          $r | Format-Table -AutoSize | Out-String | Write-Host
          if ($r | Where-Object Severity -eq 'Error') { throw 'PSScriptAnalyzer reportó errores.' }

      - name: Pester
        shell: pwsh
        run: |
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = './Tests'
          $cfg.Run.PassThru = $true
          $cfg.Run.Exit = $false
          $cfg.Output.Verbosity = 'Detailed'
          $r = Invoke-Pester -Configuration $cfg

          # Publica cada fallo como anotacion, con el mensaje completo. Sin esto
          # la anotacion solo trae el nombre de la prueba y el log del runner no
          # siempre es accesible.
          $fallidas = @($r.Tests | Where-Object Result -eq 'Failed')
          foreach ($t in $fallidas) {
              $msg = (@($t.ErrorRecord | ForEach-Object {
                  $_.DisplayErrorMessage, $_.DisplayStackTrace -join "`n"
              }) -join "`n") -replace "`r", ''
              $plano = $msg -replace "`n", '%0A' -replace ':', '%3A'
              Write-Host "::error title=$($t.ExpandedPath)::$plano"
          }

          '## Pruebas fallidas' | Out-File $env:GITHUB_STEP_SUMMARY -Append
          foreach ($t in $fallidas) {
              "### $($t.ExpandedPath)"            | Out-File $env:GITHUB_STEP_SUMMARY -Append
              '```'                               | Out-File $env:GITHUB_STEP_SUMMARY -Append
              ($t.ErrorRecord | Out-String)       | Out-File $env:GITHUB_STEP_SUMMARY -Append
              '```'                               | Out-File $env:GITHUB_STEP_SUMMARY -Append
          }

          Write-Host "Resultado: $($r.PassedCount) pasaron, $($r.FailedCount) fallaron, $($r.SkippedCount) omitidas."
          if ($r.FailedCount -gt 0) { exit 1 }
